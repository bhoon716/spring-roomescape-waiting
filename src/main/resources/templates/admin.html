<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Roomescape Admin</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header class="admin-topbar">
    <div class="admin-topbar-inner">
        <a class="admin-brand" href="/admin">ROOMESCAPE ADMIN</a>
        <nav class="admin-nav" hidden id="admin-nav">
            <button class="admin-nav-button active" data-tab-target="themes-panel" type="button">테마 관리</button>
            <button class="admin-nav-button" data-tab-target="times-panel" type="button">예약 시간 관리</button>
            <button class="admin-nav-button" data-tab-target="reservations-panel" type="button">예약 관리</button>
            <button class="admin-nav-button danger-button" id="logout-button" style="margin-left: 20px;" type="button">
                로그아웃
            </button>
        </nav>
    </div>
</header>

<main class="admin-shell">
    <section class="admin-hero">
        <div>
            <p class="admin-kicker">관리자 페이지</p>
            <h1>테마, 시간, 예약을 관리할 수 있습니다.</h1>
            <p class="admin-hero-description">각 항목을 조회하고 추가하거나 삭제하세요.</p>
        </div>
    </section>

    <section class="admin-panel" id="login-panel">
        <div class="panel-header">
            <div>
                <p class="admin-kicker">인증</p>
                <h2>관리자 로그인</h2>
            </div>
        </div>
        <form class="admin-form" id="login-form">
            <div class="field-grid field-grid-single">
                <label>
                    <span>이름</span>
                    <input autocomplete="username" name="name" placeholder="이름을 입력하세요" required type="text">
                </label>
                <label>
                    <span>비밀번호</span>
                    <input autocomplete="current-password" name="password" placeholder="비밀번호를 입력하세요" required
                           type="password">
                </label>
            </div>
            <div class="form-actions" style="margin-top: 12px; justify-content: flex-start; gap: 16px;">
                <button class="primary-button" type="submit">로그인</button>
                <p class="form-message" id="login-form-message"></p>
            </div>
        </form>
    </section>

    <section class="admin-panel" hidden id="themes-panel">
        <div class="panel-header">
            <div>
                <p class="admin-kicker">테마 관리</p>
                <h2>테마 목록</h2>
            </div>
            <button class="secondary-button" data-refresh-target="themes" type="button">새로고침</button>
        </div>
        <form class="admin-form" id="theme-form">
            <div class="field-grid field-grid-theme">
                <label>
                    <span>테마 이름</span>
                    <input name="name" placeholder="예: 공포" required type="text">
                </label>
                <label>
                    <span>테마 설명</span>
                    <input name="content" placeholder="테마 설명을 입력하세요" required type="text">
                </label>
                <label>
                    <span>이미지 URL</span>
                    <input name="url" placeholder="/themes/scary" required type="text">
                </label>
            </div>
            <div class="form-actions">
                <button class="primary-button" type="submit">테마 추가</button>
                <p class="form-message" id="theme-form-message"></p>
            </div>
        </form>
        <div class="card-list" id="themes-list"></div>
    </section>

    <section class="admin-panel" hidden id="times-panel">
        <div class="panel-header">
            <div>
                <p class="admin-kicker">예약 시간 관리</p>
                <h2>예약 시간 목록</h2>
            </div>
            <button class="secondary-button" data-refresh-target="times" type="button">새로고침</button>
        </div>
        <form class="admin-form" id="time-form">
            <div class="field-grid field-grid-single">
                <label>
                    <span>예약 시간</span>
                    <input name="startAt" required type="time">
                </label>
            </div>
            <div class="form-actions">
                <button class="primary-button" type="submit">시간 추가</button>
                <p class="form-message" id="time-form-message"></p>
            </div>
        </form>
        <div class="simple-list" id="times-list"></div>
    </section>

    <section class="admin-panel" hidden id="reservations-panel">
        <div class="panel-header">
            <div>
                <p class="admin-kicker">예약 관리</p>
                <h2>예약 목록</h2>
            </div>
            <button class="secondary-button" data-refresh-target="reservations" type="button">새로고침</button>
        </div>
        <form class="admin-form" id="reservation-form">
            <div class="field-grid field-grid-reservation">
                <label>
                    <span>예약자 이름</span>
                    <input name="username" placeholder="예약자 이름을 입력하세요" required type="text">
                </label>
                <label>
                    <span>테마</span>
                    <select id="admin-reservation-theme" name="themeId" required>
                        <option value="">테마를 선택하세요</option>
                    </select>
                </label>
                <label>
                    <span>예약 날짜</span>
                    <input id="admin-reservation-date" name="date" required type="date">
                </label>
            </div>
            <div class="reservation-slot-picker">
                <div class="section-kicker">가능한 슬롯</div>
                <div class="slot-list" id="admin-reservation-slot-list"></div>
            </div>
            <div class="form-actions">
                <button class="primary-button" type="submit">예약 추가</button>
                <p class="form-message" id="reservation-form-message"></p>
            </div>
        </form>
        <div class="simple-list" id="reservations-list"></div>
    </section>
</main>

<div class="admin-modal" hidden id="admin-modal">
    <div class="admin-modal-backdrop" data-admin-modal-close></div>
    <div aria-labelledby="admin-modal-title" aria-modal="true" class="admin-modal-dialog" role="dialog">
        <div class="admin-modal-header">
            <h2 id="admin-modal-title">알림</h2>
            <button class="secondary-button" data-admin-modal-close type="button">닫기</button>
        </div>
        <p class="admin-modal-message" id="admin-modal-message"></p>
    </div>
</div>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
